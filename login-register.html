<!DOCTYPE html>
<html lang="en" class="dark" dir="ltr">
<head>
  <script>
    if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parent Portal Access | TwinkleArts Academy</title>
  <!-- Tailwind CDN & Config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            magenta: {
              DEFAULT: '#91117a',
              hover: '#730d61',
              light: '#b01a95',
            },
            darknavy: {
              DEFAULT: '#000000',
              light: '#111111',
              deep: '#000000',
            },
            black: {
              deep: '#0a0a0a',
              light: '#171717',
              DEFAULT: '#000000',
            },
            gray: {
              850: '#202020',
            },
            slate: {
              905: '#0f172a',
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <!-- Bootstrap Icons and Fonts -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-white text-gray-900 dark:bg-darknavy-deep dark:text-gray-100 transition-colors duration-300 min-h-screen flex flex-col justify-center items-center py-10 px-4">

  <!-- ================= AUTH CARD ================= -->
  <main class="max-w-md w-full bg-white dark:bg-darknavy p-6 sm:p-8 rounded-3xl border border-gray-200 dark:border-gray-800 shadow-2xl relative z-10 space-y-6 overflow-hidden">
    <!-- Key Watermark SVG -->
    <svg class="absolute right-4 bottom-4 w-20 h-20 opacity-[0.03] dark:opacity-[0.06] pointer-events-none select-none text-magenta" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="35" cy="50" r="15" />
      <path d="M50,50 L85,50 L85,65 L75,65 L75,50 L65,50 L65,65 L55,65 L55,50" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <!-- Top Action Toggles & Logo Header Inside Card -->
    <div class="flex justify-between items-center pb-4 border-b border-gray-150 dark:border-gray-800">
      <!-- Left: Logo -->
      <a href="index.html" class="flex items-center space-x-2 rtl:space-x-reverse">
        <span class="w-8 h-8 rounded-full bg-magenta flex items-center justify-center text-white font-extrabold text-sm shadow shadow-magenta/30">T</span>
        <span class="text-lg font-bold tracking-tight text-darknavy dark:text-white font-sans">Twinkle<span class="text-magenta">Arts</span></span>
      </a>
      
      <!-- Right: RTL & Theme Toggles -->
      <div class="flex items-center space-x-3.5 rtl:space-x-reverse">
        <!-- RTL Switch (Arrows Icon) -->
        <button class="rtl-toggle text-sm hover:text-magenta transition text-gray-500 dark:text-gray-400" aria-label="Toggle RTL mode">
          <i class="bi bi-arrow-left-right text-base"></i>
        </button>
        <!-- Theme Switch (Sun/Moon Icon) -->
        <button class="theme-toggle text-sm hover:text-magenta transition text-gray-500 dark:text-gray-400" aria-label="Toggle dark mode">
          <i class="bi bi-moon-fill theme-toggle-moon text-base"></i>
          <i class="bi bi-sun-fill theme-toggle-sun text-base hidden"></i>
        </button>
      </div>
    </div>
    
    <!-- Header Text (below divider) -->
    <div class="text-center space-y-1.5 pt-2">
      <h2 class="text-2xl font-extrabold text-black dark:text-white" id="card-title">Welcome Back</h2>
      <p class="text-xs text-gray-500 dark:text-gray-400" id="card-desc">Login to manage your child's performing arts training.</p>
    </div>

    <!-- Toggle Tabs -->
    <div class="grid grid-cols-2 bg-gray-50 dark:bg-darknavy-light p-1.5 rounded-xl border border-gray-200 dark:border-gray-850">
      <button onclick="toggleForm('login')" id="login-tab-btn" class="py-2 text-xs font-bold rounded-lg bg-white dark:bg-darknavy text-magenta shadow">Sign In</button>
      <button onclick="toggleForm('register')" id="register-tab-btn" class="py-2 text-xs font-bold rounded-lg text-gray-500 dark:text-gray-400">Register</button>
    </div>

    <!-- Forms -->
    <form id="login-form" class="space-y-4">
      <div class="space-y-1">
        <label class="text-xs font-bold text-gray-500 uppercase">Email Address</label>
        <input type="email" id="login-email" required class="w-full bg-white dark:bg-darknavy-deep text-black dark:text-white border border-gray-200 dark:border-gray-850 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-magenta transition">
      </div>
      <div class="space-y-1">
        <label class="text-xs font-bold text-gray-500 uppercase">Password</label>
        <input type="password" id="login-password" required class="w-full bg-white dark:bg-darknavy-deep text-black dark:text-white border border-gray-200 dark:border-gray-850 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-magenta transition">
      </div>
      
      <!-- Remember Me & Forgot Password -->
      <div class="flex items-center justify-between text-sm pt-1">
        <label class="flex items-center gap-2 cursor-pointer text-gray-600 dark:text-gray-400 select-none">
          <input type="checkbox" id="login-remember" class="w-4.5 h-4.5 rounded border-gray-300 dark:border-gray-700 text-magenta focus:ring-magenta focus:ring-offset-0 bg-white dark:bg-darknavy-deep transition">
          <span class="text-xs font-semibold">Remember me</span>
        </label>
        <a href="#" class="text-xs font-semibold text-gray-600 dark:text-gray-400 hover:text-magenta transition">Forgot Password?</a>
      </div>

      <button type="submit" class="w-full bg-magenta hover:bg-magenta-hover text-white py-3.5 rounded-xl font-bold shadow-md shadow-magenta/20 transition uppercase tracking-wider text-xs">Sign In</button>

      <!-- Divider -->
      <div class="relative flex py-2 items-center">
        <div class="flex-grow border-t border-gray-150 dark:border-gray-850"></div>
        <span class="flex-shrink mx-4 text-gray-400 dark:text-gray-500 text-[10px] font-extrabold tracking-widest uppercase">Or continue with</span>
        <div class="flex-grow border-t border-gray-150 dark:border-gray-850"></div>
      </div>

      <!-- Social Logins -->
      <div class="grid grid-cols-2 gap-4">
        <button type="button" class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-darknavy hover:bg-gray-50 dark:hover:bg-darknavy-light transition text-xs font-bold text-gray-700 dark:text-gray-200">
          <i class="bi bi-google text-sm"></i>
          Google
        </button>
        <button type="button" class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-darknavy hover:bg-gray-50 dark:hover:bg-darknavy-light transition text-xs font-bold text-gray-700 dark:text-gray-200">
          <i class="bi bi-apple text-sm"></i>
          Apple
        </button>
      </div>

      <!-- Footer Link -->
      <div class="text-center pt-2">
        <p class="text-xs text-gray-500 dark:text-gray-400">
          Don't have an account? <a href="javascript:void(0)" onclick="toggleForm('register')" class="font-bold text-magenta hover:underline">Register here</a>
        </p>
      </div>
    </form>

    <form id="register-form" class="space-y-4 hidden">
      <div class="space-y-1">
        <label class="text-xs font-bold text-gray-500 uppercase">Full Name</label>
        <input type="text" id="register-name" required class="w-full bg-white dark:bg-darknavy-deep text-black dark:text-white border border-gray-200 dark:border-gray-850 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-magenta transition">
      </div>
      <div class="space-y-1">
        <label class="text-xs font-bold text-gray-500 uppercase">Email Address</label>
        <input type="email" id="register-email" required class="w-full bg-white dark:bg-darknavy-deep text-black dark:text-white border border-gray-200 dark:border-gray-850 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-magenta transition">
      </div>
      <div class="space-y-1">
        <label class="text-xs font-bold text-gray-500 uppercase">Password</label>
        <input type="password" id="register-password" required class="w-full bg-white dark:bg-darknavy-deep text-black dark:text-white border border-gray-200 dark:border-gray-850 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-magenta transition">
      </div>

      <!-- Agree Checkbox -->
      <div class="flex items-center text-sm pt-1">
        <label class="flex items-center gap-2 cursor-pointer text-gray-600 dark:text-gray-400 select-none">
          <input type="checkbox" id="register-agree" required class="w-4.5 h-4.5 rounded border-gray-300 dark:border-gray-700 text-magenta focus:ring-magenta focus:ring-offset-0 bg-white dark:bg-darknavy-deep transition">
          <span class="text-xs font-semibold">I agree to the Terms of Service and Privacy Policy.</span>
        </label>
      </div>

      <button type="submit" class="w-full bg-magenta hover:bg-magenta-hover text-white py-3.5 rounded-xl font-bold shadow-md shadow-magenta/20 transition uppercase tracking-wider text-xs">Create Account</button>

      <!-- Divider -->
      <div class="relative flex py-2 items-center">
        <div class="flex-grow border-t border-gray-150 dark:border-gray-850"></div>
        <span class="flex-shrink mx-4 text-gray-400 dark:text-gray-500 text-[10px] font-extrabold tracking-widest uppercase">Or sign up with</span>
        <div class="flex-grow border-t border-gray-150 dark:border-gray-850"></div>
      </div>

      <!-- Social Logins -->
      <div class="grid grid-cols-2 gap-4">
        <button type="button" class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-darknavy hover:bg-gray-50 dark:hover:bg-darknavy-light transition text-xs font-bold text-gray-700 dark:text-gray-200">
          <i class="bi bi-google text-sm"></i>
          Google
        </button>
        <button type="button" class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-darknavy hover:bg-gray-50 dark:hover:bg-darknavy-light transition text-xs font-bold text-gray-700 dark:text-gray-200">
          <i class="bi bi-apple text-sm"></i>
          Apple
        </button>
      </div>

      <!-- Footer Link -->
      <div class="text-center pt-2">
        <p class="text-xs text-gray-500 dark:text-gray-400">
          Already have an account? <a href="javascript:void(0)" onclick="toggleForm('login')" class="font-bold text-magenta hover:underline">Log in here</a>
        </p>
      </div>
    </form>
  </main>

  <script src="assets/js/main.js"></script>
  <script>
    function toggleForm(formType) {
      const loginForm = document.getElementById('login-form');
      const registerForm = document.getElementById('register-form');
      const loginTab = document.getElementById('login-tab-btn');
      const registerTab = document.getElementById('register-tab-btn');
      const cardTitle = document.getElementById('card-title');
      const cardDesc = document.getElementById('card-desc');

      if (formType === 'login') {
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        loginTab.className = "py-2 text-xs font-bold rounded-lg bg-white dark:bg-darknavy text-magenta shadow";
        registerTab.className = "py-2 text-xs font-bold rounded-lg text-gray-500 dark:text-gray-400";
        cardTitle.textContent = "Welcome Back";
        cardDesc.textContent = "Login to manage your child's performing arts training.";
      } else {
        loginForm.classList.add('hidden');
        registerForm.classList.remove('hidden');
        registerTab.className = "py-2 text-xs font-bold rounded-lg bg-white dark:bg-darknavy text-magenta shadow";
        loginTab.className = "py-2 text-xs font-bold rounded-lg text-gray-500 dark:text-gray-400";
        cardTitle.textContent = "Create Account";
        cardDesc.textContent = "Register a parent portal membership account today.";
      }
    }

    // Initialize default credentials if local storage is empty
    if (!localStorage.getItem('registeredEmail')) {
      localStorage.setItem('registeredEmail', 'sarah.jenkins@example.com');
      localStorage.setItem('registeredPassword', 'password123');
      localStorage.setItem('registeredName', 'Sarah Jenkins');
    }

    // Handle Login Form Submission
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const emailInput = document.getElementById('login-email').value.trim();
      const passwordInput = document.getElementById('login-password').value;

      const savedEmail = localStorage.getItem('registeredEmail');
      const savedPassword = localStorage.getItem('registeredPassword');

      if (emailInput === savedEmail && passwordInput === savedPassword) {
        window.location.href = 'dashboard.html';
      } else {
        alert('Invalid email address or password. Please try again or create an account.');
      }
    });

    // Handle Register Form Submission
    document.getElementById('register-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const nameInput = document.getElementById('register-name').value.trim();
      const emailInput = document.getElementById('register-email').value.trim();
      const passwordInput = document.getElementById('register-password').value;

      if (!emailInput || !passwordInput || !nameInput) {
        alert('Please fill out all fields.');
        return;
      }

      localStorage.setItem('registeredEmail', emailInput);
      localStorage.setItem('registeredPassword', passwordInput);
      localStorage.setItem('registeredName', nameInput);

      alert('Account successfully created! Redirecting to parent portal...');
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
